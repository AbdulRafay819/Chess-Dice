<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Aurevak crest">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a6" />
      <stop offset="0.45" stop-color="#e2b76a" />
      <stop offset="1" stop-color="#9c6f2c" />
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3346" />
      <stop offset="0.5" stop-color="#121722" />
      <stop offset="1" stop-color="#070a10" />
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" />
      <stop offset="0.4" stop-color="#ffa646" />
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.95" />
      <stop offset="1" stop-color="#c08b3c" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- hex ring -->
  <path d="M64 5 113 33v62l-49 28-49-28V33z" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.75" />
  <path d="M64 12.5 106.5 37v54l-42.5 24.5L21.5 91V37z" fill="none" stroke="url(#gold)" stroke-width="0.7" opacity="0.35" />

  <!-- crossed thorns -->
  <g stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <path d="M31 88 96 40" />
    <path d="M32 40 96 88" />
  </g>

  <!-- crown -->
  <path d="M40 47 48 30l10 14 6-17 6 17 10-14 8 17z" fill="url(#stone)" stroke="url(#edge)" stroke-width="1.6"
        stroke-linejoin="round" />
  <path d="M40 47h48" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round" />

  <!-- monolith -->
  <path d="M55 51h18l5 44-14 10-14-10z" fill="url(#stone)" stroke="url(#edge)" stroke-width="1.6"
        stroke-linejoin="round" />
  <path d="M64 51v54" stroke="url(#edge)" stroke-width="0.8" opacity="0.5" />
  <path d="M57.5 66h13" stroke="url(#gold)" stroke-width="1" opacity="0.5" />
  <path d="M58.5 76h11" stroke="url(#gold)" stroke-width="1" opacity="0.35" />

  <!-- ember core at the base -->
  <circle cx="64" cy="86" r="15" fill="url(#ember)" opacity="0.6" />
  <path d="M64 79.5 70 86l-6 6.5L58 86z" fill="#ffca85" stroke="#ffe8c4" stroke-width="0.7" />

  <!-- plinth -->
  <path d="M44 101h40l-6 7H50z" fill="url(#stone)" stroke="url(#edge)" stroke-width="1.2" stroke-linejoin="round" />
</svg>
